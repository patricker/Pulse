name: Pulse Modern .NET 8 Build

on:
  push:
    branches: [ master, v3-net8, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-old:
    name: Legacy .NET 4.8 Build (Win7-11 compat)
    runs-on: windows-latest # windows-2019 retired June 2024, windows-latest has MSBuild + .NET 4.8 targeting pack
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet (old)
        run: nuget restore Pulse/Pulse.sln

      - name: Build Legacy Solution (net4.8)
        run: msbuild Pulse/Pulse.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload Legacy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-net48-legacy
          path: Pulse/bin/Release/
          retention-days: 7

  build-modern:
    name: Modern .NET 8 Build (Win10/11)
    runs-on: windows-latest # Win11 image with .NET 8 SDK + Win11 SDK 22621
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Modern
        run: dotnet restore modern/Pulse.Modern.sln

      - name: Build Modern (Debug)
        run: dotnet build modern/Pulse.Modern.sln -c Release --no-restore

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Test Providers (wallhaven API probe)
        run: |
          dotnet build modern/src/Providers/wallbase/wallhaven.csproj -c Release
          python -c "import requests; r=requests.get('https://wallhaven.cc/api/v1/search?q=nature', headers={'User-Agent':'Pulse/2.0'}); print(f'Wallhaven API {r.status_code} data={len(r.json().get(\"data\",[]))}'); assert r.status_code==200"

      - name: Publish Single File (self-contained)
        run: |
          dotnet publish modern/src/Pulse/Pulse.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64-single/

      - name: Publish Framework Dependent
        run: |
          dotnet publish modern/src/Pulse/Pulse.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64-fd/

      - name: Upload Modern Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-net8-modern
          path: publish/
          retention-days: 14

  build-cross-platform:
    name: Cross-Platform .NET 8 (Linux/macOS) - No Windows UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Restore Cross-Platform (Bing + wallhaven API only)
        run: |
          # Build only pure providers that are net8.0 or have EnableWindowsTargeting
          # With EnableWindowsTargeting=true, net8.0-windows can build on Linux (with warnings)
          dotnet restore modern/src/Pulse.Base/Pulse.Base.csproj || echo "Base restore may warn on Linux, continuing"
          dotnet restore modern/src/Providers/BingWallpaper/BingWallpaper.csproj
          dotnet restore modern/src/Providers/wallbase/wallhaven.csproj
          dotnet restore modern/src/Pulse.CLI/Pulse.CLI.csproj

      - name: Build Cross-Platform CLI (Linux buildable)
        run: |
          dotnet build modern/src/Pulse.CLI/Pulse.CLI.csproj -c Release --no-restore
          echo "CLI builds on Linux - tests API providers without Windows wallpaper APIs"

      - name: Test Providers from Linux (API only, no wallpaper set)
        run: |
          # Probe Wallhaven and Bing APIs from Linux runner (same as Windows probe)
          python -c "import requests; r=requests.get('https://wallhaven.cc/api/v1/search?q=nature', headers={'User-Agent':'Pulse/2.0 (Linux)'}); print(f'Wallhaven API {r.status_code} data={len(r.json().get(\"data\",[]))}'); assert r.status_code==200"
          python -c "import requests; r=requests.get('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=en-US', headers={'User-Agent':'Pulse/2.0 (Linux)'}); j=r.json(); print(f'Bing API {r.status_code} images={len(j[\"images\"])}'); assert r.status_code==200"

      - name: Publish Linux self-contained CLI
        run: |
          dotnet publish modern/src/Pulse.CLI/Pulse.CLI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/linux-x64-cli/ || echo "Publish may need EnableWindowsTargeting warnings, but should produce binary"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-linux-cli
          path: publish/linux-x64-cli/
          retention-days: 7

  # Optional: MSIX packaging (requires cert)
